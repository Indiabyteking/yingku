{% extends "base.html" %}
{% block content %}
<div class="page-container py-20">
  <div class="surface-card max-w-lg mx-auto p-8 text-center space-y-4">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-full text-sm font-bold" style="background-color: var(--bg-subtle); color: var(--text-secondary);">
      {{ code }}
    </div>
    <h1 class="text-xl font-bold">{{ title }}</h1>
    <p class="text-sm leading-relaxed" style="color: var(--text-secondary);">{{ message }}</p>
    <div class="pt-2 flex items-center justify-center gap-3">
      <a href="/" class="btn-primary">返回首页</a>
      <a href="/import" class="btn-secondary">添加影视</a>
    </div>
  </div>
</div>
{% endblock %}
