[project]
name = "yingku"
version = "0.1.0"
description = "本机影视资源管理网站（AList + TMDB + MDBList + DeepSeek + MPC-HC）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.3",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "pypinyin>=0.53.0",
    "zhconv>=1.4.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
yingku = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
